spring:
  application:
    name: mytax-mapper-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mytax_mapper?useSSL=false&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:mytax}
    password: ${DB_PASSWORD:mytax}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-local-env}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  crypto:
    secret-key: ${MYINVOIS_ENCRYPTION_KEY:change-this-32-byte-min-secret-key}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  myinvois:
    id-server-base-url: ${MYINVOIS_ID_SERVER_BASE_URL:https://preprod-identity.myinvois.hasil.gov.my}
    api-base-url: ${MYINVOIS_API_BASE_URL:https://preprod-api.myinvois.hasil.gov.my}
    # Production. Override via env vars if LHDN issues different hosts for your account.
    prod-id-server-base-url: ${MYINVOIS_PROD_ID_SERVER_BASE_URL:https://api.myinvois.hasil.gov.my}
    prod-api-base-url: ${MYINVOIS_PROD_API_BASE_URL:https://api.myinvois.hasil.gov.my}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  # Comma-separated emails granted the ADMIN role (admin console) at start-up.
  admin-emails: ${ADMIN_EMAILS:}
  # Public address of the web app — used for links in notification emails.
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  mail:
    # Notification emails are sent only when an SMTP server is configured via the standard Spring
    # env vars: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
    # SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
    # (e.g. Gmail: smtp.gmail.com:587 with an app password). Without them, alerts are in-app only.
    from: ${APP_MAIL_FROM:MyTax <no-reply@mytax.app>}
  ai-usage:
    # Gemini list prices used to meter usage (USD per 1M tokens). Output includes "thinking" tokens.
    # Update these to your model's actual price — they drive the % shown to users.
    input-usd-per-million: ${AI_INPUT_USD_PER_MILLION:0.30}
    output-usd-per-million: ${AI_OUTPUT_USD_PER_MILLION:2.50}
    # A "typical" parse, measured from real receipt extractions (Oct 2026): ~2,100 input and
    # ~2,300 output+thinking tokens. Plan allowances are expressed as N typical parses.
    typical-input-tokens: 2100
    typical-output-tokens: 2300
  mapping:
    # which AI provider powers document mapping: "gemini" (default, has a free tier) or "claude"
    engine: ${MAPPING_ENGINE:gemini}
  consolidation:
    # Placeholder generic-buyer values for consolidated e-invoices — NOT verified against LHDN's
    # actual published policy (see ConsolidationProperties). Override once confirmed.
    generic-buyer-name: ${CONSOLIDATION_GENERIC_BUYER_NAME:General Public}
    generic-buyer-tin: ${CONSOLIDATION_GENERIC_BUYER_TIN:EI00000000010}
  stripe:
    # Stripe (FPX, Visa/Mastercard, Apple Pay; auto-renew via Stripe Billing). Use test keys until
    # go-live. Webhook endpoint: {backend}/api/billing/stripe/webhook — events: checkout.session.completed,
    # checkout.session.async_payment_succeeded, invoice.paid, customer.subscription.updated,
    # customer.subscription.deleted. Locally: `stripe listen --forward-to localhost:8080/api/billing/stripe/webhook`.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    # one line per request (method, path, status, duration, user) — see RequestLoggingFilter
    com.mytax.mapper.access: INFO
    # application code: bump to DEBUG locally if you need more detail than the access log gives
    com.mytax.mapper: INFO
